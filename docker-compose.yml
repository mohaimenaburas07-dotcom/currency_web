version: '3.8'

services:
  currency_web_docker_test:
    container_name: currency_web_docker_test
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Shared volume for uploads to see production media in test app
      - /var/lib/alwaha-currency/uploads:/app/uploads
    environment:
      UPLOADS_DIR: /app/uploads
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    restart: unless-stopped
